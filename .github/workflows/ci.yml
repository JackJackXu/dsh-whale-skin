name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --legacy-peer-deps: the peerDependencies are @deepseek-ai workspace
      # packages (dsh-client-runtime, cordis) that do NOT exist on the public
      # npm registry — the dsh profile provides them at install time. CI only
      # needs the devDependencies (typescript/tsdown/lightningcss) to build;
      # auto-installing the peers would ERESOLVE-fail within seconds.
      - run: npm install --legacy-peer-deps
      # Type safety + unit tests.
      - run: npm run typecheck
      - run: npm test
      # AUTHORITATIVE build (tsc + tsdown), then assert the committed lib/
      # matches it exactly: `git diff --exit-code` fails if the build left any
      # uncommitted change (a stale bundle, a stray .map). This is the guard
      # against "source and committed bundle drift apart".
      #
      # The diff is scoped to lib/: `npm install` legitimately rewrites
      # package-lock.json per platform (optional native-binding entries for
      # win32/linux/… differ), so a whole-tree diff would always fail on the
      # Linux runner. lib/ output itself is platform-independent.
      - run: npm run build
      - run: node --check lib/client.js
      - run: git diff --exit-code -- lib/
