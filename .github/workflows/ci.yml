name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      # Type safety + unit tests.
      - run: npm run typecheck
      - run: npm test
      # AUTHORITATIVE build (tsc + tsdown), then assert the committed lib/
      # matches it exactly: `git diff --exit-code` fails if the build left any
      # uncommitted change (a stale bundle, a stray .map). This is the guard
      # against "source and committed bundle drift apart".
      - run: npm run build
      - run: node --check lib/client.js
      - run: git diff --exit-code
