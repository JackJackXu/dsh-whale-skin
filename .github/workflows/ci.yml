name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      # Type safety + bundle rebuild must both stay green.
      - run: npm run typecheck
      - run: node build-client.cjs
      - run: node --check lib/client.js
